[package]
name = "netlink-ddns"
version = "0.1.8"
description = "A minimal DDNS server that publishes IP changes to DNS."
license = "GPL-3.0-only"
repository = "https://github.com/tarka/netlink-ddns"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
anyhow = "1.0.104"
async-fs = "2.2.0"
compio = { version = "0.19.2", features = ["io", "macros", "time"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
libcorn = "0.10.1"
netlink-sys = { version = "0.9.0", features = ["smol_socket"] }
once_cell = "1.21.4"
pico-args = "0.5.0"
rtnetlink = { version = "0.24.0", default-features = false, features = ["smol_socket"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zone-update = { version = "0.12.3", features = ["async"] }

[dev-dependencies]
tracing-test = "0.2.6"

[package.metadata.binstall]
bin-dir = "{ name }-v{ version }-{ target }/bin/{ bin }{ binary-ext }"
